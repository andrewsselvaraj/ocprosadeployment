# Zero-trust networking inside the namespace: deny everything, then allow only the flows the
# architecture needs.
#   OpenShift router  -> api-gateway
#   api-gateway       -> identity / academic / question / exam
#   exam-service      -> question-service  (/internal/answers/evaluate)
#   cluster monitoring -> every pod (Prometheus scraping /actuator/prometheus)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router-to-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backends
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-exam-to-question
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: question-service
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: exam-service
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: m2its
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - port: 8080
