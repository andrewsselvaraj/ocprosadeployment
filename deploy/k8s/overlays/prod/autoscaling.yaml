# Production only: HorizontalPodAutoscalers (scale on CPU) and PodDisruptionBudgets.
# PDBs are deliberately NOT in dev: with 1 replica, minAvailable: 1 would block node drains
# and therefore ROSA cluster upgrades.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70     # % of the CPU request
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
